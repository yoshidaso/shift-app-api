version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: shift-app-api
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - mysql
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    container_name: shift-app-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: shift-app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
